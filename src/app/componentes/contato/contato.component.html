<section class="contato">
    <h1>Contato</h1>
    <p class="subtitle">Vamos conversar? Preencha o formulário ou me encontre nas redes.</p>
  
    <form class="contact-form">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome">
  
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
  
      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem..."></textarea>
  
      <button type="submit" class="btn-primary">Enviar</button>
    </form>
  
    <div class="social-links">
      <a href="#">LinkedIn</a>
      <a href="#">GitHub</a>
      <a href="#">E-mail</a>
    </div>
  </section>
